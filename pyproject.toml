[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-git"
version = "1.0.0"
description = "Local Git assistant: watches a repository, writes Conventional Commit messages, pushes and opens pull requests on GitHub or Azure DevOps."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sandeep Srinivasan" }]
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "watchdog>=4.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
keyring = ["keyring>=24"]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.6", "pyinstaller>=6.6"]

[project.scripts]
aura = "aura.cli:main"

[project.gui-scripts]
aura-gui = "aura.gui:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# Qt stylesheet text
"src/aura/style.py" = ["E501"]
